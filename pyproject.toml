[project]
name = "bootcamp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
